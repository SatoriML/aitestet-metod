# Publiceringspolicy (metodägarens beslut 2026-10-14). Ersätter kravet på förhandsvarsel till leverantörer (varsel minst 24 timmar före
# publicering) med rättelser i efterhand. Alla leverantörer behandlas lika. Sakfel kan anmälas till rättelseadressen när som helst
# och rättas öppet enligt rättelsereglerna (METOD.md avsnitt 14). Ett svar från en leverantör (genmäle) publiceras i sin helhet,
# men ger ingen rätt att påverka frågor, regler eller resultat. Grind G13 kontrollerar policyn deterministiskt (fail-closed: saknas
# policyn eller har den ett okänt värde blockeras publiceringen).
#   notice_policy: corrections_after = inget förhandsvarsel; rättelseadress, rättelselogg och genmäle ska synas på sajten
#                  advance_notice    = förhandsvarsel enligt notice_log.yaml (minst 24 timmar före). Koden finns kvar så att det går
#                                      att slå på igen, men används inte nu.
publication:
  notice_policy: corrections_after
  corrections_email: hej@aitestet.se
  right_of_reply: publish_in_full

# Presentation av resultatöversikten (metodägarens beslut 2026-10-15). Ändrar inte vad som mäts, vilka jämförelser som är stödda eller titelregeln:
# "Bäst i faktaprovet (läge A)" delas fortfarande bara ut enligt titles.best_in_factprov.
#   sort_by/sort_order: modellerna visas efter träffsäkerhet (punktskattningen) i läge A på huvudnivån, högst först; felandelen visas bredvid.
#   tie_rule: rank_range_supported = varje modell får placeringen [1 + B, N - W], där B är antalet modeller som är statistiskt säkert
#             bättre och W antalet som är statistiskt säkert sämre på sort_by-måttet (jämförelse med supported och sensitivity_ok i
#             comparisons.json, samma läge och nivå), och N är antalet modeller. Modeller vars skillnad inte är stödd får överlappande
#             placering, till exempel "1-4". En modell utan någon stödd jämförelse får hela intervallet och "går inte att placera".
#             En modell som G6 har satt i väntan (HOLD) jämförs inte av G9 (model_held i comparisons.json) och får ingen placering
#             ("ej jämförd"); N räknar bara de jämförda modellerna. Samma regel används för felandelen (lägre är bättre) på modellsidorna.
#   cost: vad det faktiskt kostade i testet, räknat av kod ur körningens loggade tokens och kostnad (answers.jsonl: tokens_out, cost_usd).
#         Påverkar inte rättning, jämförelser eller titlar. En modell med högre pris per token kan bli billigare om den använder färre tokens.
#           tokens_ut_medel            = summa tokens ut / antal svar (utdata, resonemangstokens inräknade)
#           kostnad_per_100_fragor_sek = summa kostnad (USD) / antal svar * 100 * sek_per_usd
#           kostnad_per_ratt_sek       = summa kostnad (USD) / antal rätta svar * sek_per_usd (ej definierat vid 0 rätt)
#         sek_per_usd är Riksbankens kurs (SEKUSDPMI) den dag som står i fx_date, samma kurs som prissidan, fast så att beloppen går att räkna om.
presentation:
  sort_by: traffsakerhet
  sort_order: descending
  shown_next_to: [felandel]
  mode: A
  level: alla
  tie_rule: rank_range_supported
  title_rule_unchanged: true
  cost:
    metrics: [tokens_ut_medel, kostnad_per_100_fragor_sek, kostnad_per_ratt_sek]
    sek_per_usd: "9.96695"
    fx_date: "2026-10-14"
    fx_source: riksbanken-sekusd
